<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Slate</title>
  <desc>A whiteboard seen from the front, in Tokyo Night colors: a dark dotted board with a blue box and a lilac circle joined by an arrow, and a yellow post-it stuck over its corner, each piece with a hard shadow.</desc>
  <defs>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
  </defs>
  <g transform="translate(256 256) scale(1.2) translate(-256 -262)">
    <!-- The board; one hard shadow, as Hype's slides. -->
    <rect x="64" y="120" width="384" height="284" rx="18" fill="#0e0f17" transform="translate(0 8)"/>
    <rect x="64" y="120" width="384" height="284" rx="18" fill="#1a1b26" stroke="#3b4261" stroke-width="3"/>
    <!-- The dots of the canvas. -->
    <g fill="#3b4261">
      <circle cx="96" cy="152" r="4"/><circle cx="96" cy="216" r="4"/><circle cx="96" cy="280" r="4"/><circle cx="96" cy="344" r="4"/>
      <circle cx="160" cy="280" r="4"/><circle cx="160" cy="344" r="4"/>
      <circle cx="224" cy="344" r="4"/><circle cx="224" cy="152" r="4"/>
      <circle cx="288" cy="152" r="4"/><circle cx="288" cy="216" r="4"/>
      <circle cx="416" cy="216" r="4"/><circle cx="416" cy="280" r="4"/><circle cx="416" cy="372" r="4"/>
    </g>
    <!-- A box, joined by an arrow to a circle. -->
    <rect x="108" y="168" width="132" height="88" rx="14" fill="#0e0f17" transform="translate(0 6)"/>
    <rect x="108" y="168" width="132" height="88" rx="14" fill="url(#main)"/>
    <rect x="134" y="205" width="80" height="14" rx="7" fill="#1a1b26" opacity=".35"/>
    <path d="M250 262L290 290" fill="none" stroke="#c0caf5" stroke-width="12" stroke-linecap="round"/>
    <path d="M314 307L279 302L297 277Z" fill="#c0caf5" stroke="#c0caf5" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="358" cy="330" r="46" fill="#0e0f17" transform="translate(0 6)"/>
    <circle cx="358" cy="330" r="46" fill="#bb9af7"/>
    <!-- A post-it stuck over the corner, a little askew. -->
    <g transform="rotate(7 372 142)">
      <rect x="318" y="88" width="108" height="108" rx="6" fill="#0e0f17" transform="translate(0 8)"/>
      <rect x="318" y="88" width="108" height="108" rx="6" fill="#e0af68"/>
      <rect x="318" y="88" width="108" height="20" rx="6" fill="#0e0f17" opacity=".12"/>
      <rect x="336" y="128" width="72" height="12" rx="6" fill="#0e0f17" opacity=".35"/>
      <rect x="336" y="152" width="48" height="12" rx="6" fill="#0e0f17" opacity=".35"/>
    </g>
  </g>
</svg>
